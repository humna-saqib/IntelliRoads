<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IntelliRoads: real-time adaptive traffic signal control and monitoring" />
    <meta name="theme-color" content="#fafafa" />
    <title>IntelliRoads</title>
    <script>
      // Apply the saved (or system) theme before first paint so there is no flash of the wrong theme.
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('intelliroads_theme');
          dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#09090b' : '#fafafa');
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html { background: #fafafa; }
      html.dark { background: #09090b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
